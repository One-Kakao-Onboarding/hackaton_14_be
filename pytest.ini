[pytest]
# Pytest 설정 파일

# 테스트 탐색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*

# 출력 옵션
addopts =
    -v                  # Verbose 출력
    --tb=short          # Traceback을 짧게 표시
    --strict-markers    # 정의되지 않은 marker 사용 시 에러
    --disable-warnings  # 경고 비활성화
    -p no:cacheprovider # 캐시 비활성화

# Markers 정의
markers =
    slow: 느린 테스트 (deselect with '-m "not slow"')
    integration: 통합 테스트
    unit: 단위 테스트
    api: API 테스트

# 최소 코드 커버리지 (선택사항)
# --cov=app --cov-report=html --cov-report=term
